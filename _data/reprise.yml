# Gedeelde teksten en gegevens voor de hele site.
# Pas hier aan, dan verandert het overal tegelijk.

slogan: Bekende theatertitels met bekende acteurs, in het cultureel centrum van Hasselt.

locatie:
  naam: CCHA
  voluit: Cultureel Centrum Hasselt (CCHA)
  straat: Kunstlaan 5
  postcode: "3500"
  gemeente: Hasselt
  aanvang: "20:00"
  kaart: https://maps.app.goo.gl/KkdsDtXpD2LTySCM7

ticketvoorwaarden: >-
  Tickets zijn niet omruilbaar, annuleerbaar of terugbetaalbaar.
  Er wordt een reservatiekost van €2 per boeking gerekend.

abonnement:
  korting: 7
  aanbod: Boek 3 verschillende voorstellingen en ontvang automatisch €7 korting.
  meermaals: Boekt u elke voorstelling meerdere keren? Dan krijgt u de korting ook meerdere keren.
  kassa: De korting wordt automatisch verrekend aan de kassa, voordat u uw betaalmethode kiest.

parkeren:
  prijs: 3
  kort: >-
    Inwoners van Hasselt parkeren gratis met het Hasselts Parkeerbudget.
    Komt u van buiten Hasselt? Reserveer vooraf een parkeerplaats voor €3 per avond.

nieuwsbrief:
  tekst: >-
    Wil u als eerste op de hoogte zijn van onze voorstellingen? Schrijf u in voor onze
    nieuwsbrief. We sturen geen spam en delen uw adres nooit met derden.
  # Inschrijven gebeurt bij onze eigen listmonk, op de publieke lijst hieronder
  # (dubbele opt-in: wie zich inschrijft, krijgt eerst een bevestigingsmail).
  listmonk: https://listmonk.veemax.be
  lijst: eff6a931-28b3-4db5-a4ed-aa366d1b5f40

