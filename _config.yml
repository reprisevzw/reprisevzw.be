# Instellingen van de website van Reprise vzw.
# Na een wijziging hier moet "jekyll serve" opnieuw gestart worden.

url: https://reprisevzw.be
baseurl: ""
title: Reprise vzw
description: >-
  Wij brengen theater voorstellingen naar Hasselt!
lang: nl
locale: nl_BE
timezone: Europe/Brussels

author:
  name: Reprise vzw
  email: info@reprisevzw.be

# Logo voor zoekmachines (jekyll-seo-tag).
logo: /assets/images/logo/logo_50pct.png

## Bezoekers tellen
analytics:
  provider: umami

  ## Umami: self-hosted, counts visitors without cookies (no banner needed)
  umami:
    url        : https://stats.reprisevzw.be
    website_id : f1986b29-7d86-4be3-bee0-25d020f3824e

## Voorstellingen: één bestand per voorstelling in _voorstellingen/
collections:
  voorstellingen:
    output: true
    permalink: /voorstellingen/:slug

defaults:
  - scope:
      path: ""
      type: voorstellingen
    values:
      layout: voorstelling
  - scope:
      path: ""
      type: pages
    values:
      layout: pagina
      # Afbeelding als de pagina gedeeld wordt op sociale media.
      image: /assets/images/reprise/theater_background_red_purple3.webp

markdown: kramdown
sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-email-protect

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - build.sh
  - serve.sh
  - aws_lamda_getform.js
  - /tools
  - /vendor
  - /.idea
  - /.github
