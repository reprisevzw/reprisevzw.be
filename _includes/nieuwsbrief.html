{%- comment -%}
  Inschrijven op de nieuwsbrief gebeurt met het formulier van SendGrid op de
  pagina /nieuwsbrief (zelfde manier als altijd). Dit blok verwijst daarheen.
{%- endcomment -%}
<section class="sectie nieuwsbrief" aria-labelledby="nieuwsbrief-titel">
  <div class="houder nieuwsbrief__raster">
    <div class="nieuwsbrief__tekst">
      <h2 id="nieuwsbrief-titel" class="nieuwsbrief__titel">Nieuwsbrief</h2>
      <p>{{ site.data.reprise.nieuwsbrief.tekst }}</p>
    </div>
    <div class="nieuwsbrief__actie">
      <a class="knop knop--donker" href="{{ '/nieuwsbrief' | relative_url }}">Inschrijven {% include icoon/pijl.html maat=20 %}</a>
    </div>
  </div>
</section>
